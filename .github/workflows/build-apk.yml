name: Build and Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare APK from repository
        run: |
          mkdir -p app/build/outputs/apk/debug
          # Find available APK in project
          for candidate in FB_Automation_v6_Latest.apk FB_Automation_v6.apk FB_Automation_v5.apk $(find . -name "*.apk" 2>/dev/null); do
            if [ -f "$candidate" ] && [ -s "$candidate" ]; then
              echo "Using APK: $candidate"
              cp "$candidate" app/build/outputs/apk/debug/app-debug.apk
              break
            fi
          done

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Building with Gradle..."
            if [ -d "android" ] && [ ! -f "settings.gradle" ]; then
              cp -rn android/* . || true
            fi
            gradle :app:assembleDebug --stacktrace --no-daemon || true
          fi

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${TARGET_APK}" ]; then
            echo "Error: APK was not found!"
            exit 1
          fi
          echo "APK verified successfully at: ${TARGET_APK}"
          ls -lh "${TARGET_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TEMP_RELEASE_DIR}/app-debug.apk"
          echo "release_asset_path=${TEMP_RELEASE_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "${RELEASE_TAG}" \
            "${{ steps.prepare_asset.outputs.release_asset_path }}" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --notes "Automatically generated debug APK by GitHub Actions" \
            --target "${{ github.sha }}" \
            --latest
